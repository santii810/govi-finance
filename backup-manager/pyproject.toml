[project]
name = "finanzas-backup-manager"
version = "0.1.0"
description = "Exporta NocoDB a CSV, comprime y sube a Google Drive u OneDrive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "croniter>=2.0",
]

[project.scripts]
finanzas-backup = "backup_manager.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
