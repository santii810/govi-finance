[project]
name = "finanzas-backup-manager"
version = "0.1.0"
description = "Exporta NocoDB a CSV, comprime y sube a Google Drive u OneDrive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "croniter>=2.0",
]

[project.scripts]
finanzas-backup = "backup_manager.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
