name: nocodb

services:
  web:
    build:
      context: ../front
      dockerfile: Dockerfile
    depends_on:
      nocodb:
        condition: service_started
    container_name: finance-web
    environment:
      NOCODB_URL: http://nocodb:8080
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      TIMEZONE: ${TIMEZONE:-Europe/Madrid}
      BACKUP_MANAGER_URL: http://backup-manager:8090
      BACKUP_TRIGGER_SECRET: ${BACKUP_TRIGGER_SECRET}
    ports:
      - "3001:3000"
    restart: always

  bot:
    build:
      context: ../worker
      dockerfile: Dockerfile
    depends_on:
      nocodb:
        condition: service_started
    container_name: finance-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:-}
      TELEGRAM_SANDRA_USER_ID: ${TELEGRAM_SANDRA_USER_ID:-}
      TELEGRAM_USER_PERSONAS: ${TELEGRAM_USER_PERSONAS:-}
      NOCODB_URL: http://nocodb:8080
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN}
      AUTOMATIC_ACTIONS_TABLE_ID: mugm6tw1ail68rq
      ACCOUNTS_TABLE_ID: mr0ouismkezq5un
      ACCOUNT_DUMPS_TABLE_ID: mcnkpvmpdvo6h9w
    restart: always

  backup-manager:
    build:
      context: ../backup-manager
      dockerfile: Dockerfile
    depends_on:
      nocodb:
        condition: service_started
    container_name: finance-backup
    environment:
      NOCODB_URL: http://nocodb:8080
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN}
      NOCODB_BASE_ID: ${NOCODB_BASE_ID:-pnf173not1wvzg0}
      BACKUP_PROVIDER: ${BACKUP_PROVIDER:-none}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-${TIMEZONE:-Europe/Madrid}}
      BACKUP_LOCAL_RETENTION: ${BACKUP_LOCAL_RETENTION:-7}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${GOOGLE_DRIVE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      ONEDRIVE_CLIENT_ID: ${ONEDRIVE_CLIENT_ID:-}
      ONEDRIVE_CLIENT_SECRET: ${ONEDRIVE_CLIENT_SECRET:-}
      ONEDRIVE_REFRESH_TOKEN: ${ONEDRIVE_REFRESH_TOKEN:-}
      ONEDRIVE_FOLDER_PATH: ${ONEDRIVE_FOLDER_PATH:-/Finanzas/backups}
      BACKUP_TRIGGER_SECRET: ${BACKUP_TRIGGER_SECRET}
      BACKUP_TRIGGER_PORT: ${BACKUP_TRIGGER_PORT:-8090}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_USER_ID: ${TELEGRAM_OWNER_USER_ID:-}
    volumes:
      - backup_staging:/data/backups
    restart: always

  nocodb:
    depends_on:
      root_db:
        condition: service_healthy
    environment:
      NC_DB: "pg://root_db:5432?u=postgres&p=password&d=root_db"
    image: "nocodb/nocodb:2026.06.0"
    ports:
      - "23456:8080"
    restart: always
    volumes:
      - "nc_data:/usr/app/data"

  root_db:
    environment:
      POSTGRES_DB: root_db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    healthcheck:
      interval: 10s
      retries: 10
      test: "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
      timeout: 2s
    image: postgres:16.6
    restart: always
    volumes:
      - "db_data:/var/lib/postgresql/data"
volumes:
  db_data: {}
  nc_data: {}
  backup_staging: {}
